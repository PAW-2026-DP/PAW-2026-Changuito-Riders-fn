<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changuito Logística · Ingresar</title>
</head>
<body>
  <main>
    <section aria-labelledby="login-titulo">
      <img src="assets/img/placeholder.svg" alt="" width="96" height="96">
      <h1 id="login-titulo">Changuito Logística</h1>
      <form action="pages/tareas.html" method="get">
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="rider@email.com" autocomplete="email" required>
        </p>
        <p>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </p>
        <button type="submit">Ingresar</button>
      </form>
      <p><a href="#">¿Olvidaste tu contraseña?</a></p>
    </section>
  </main>
</body>
</html>
